services:
  itslog:
    build:
      dockerfile: itslog/Dockerfile
    platform: linux/amd64
    command: bash -c "
      /app/its-log serve
      "
    ports:
      - "8888:8888"
    volumes:
      - ../itslog:/app
      - ../data/itslog:/data
    env_file: .env.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://itslog:8888/v1/health"]
      interval: 300s
      retries: 1
      start_period: 5s
      timeout: 3s

  e2e:
    build:
      dockerfile: e2e/Dockerfile
    platform: linux/amd64
    command: "python3 /app/e2e/main.py -a generate -a load -a run"
    volumes:
      - .:/app
    profiles:
      - testing
    environment:
      ITSLOG_DAYS: "${ITSLOG_DAYS:-30}"
      ITSLOG_EVENTS: "${ITSLOG_EVENTS:-40000}"
      ITSLOG_ACTIONS: "${ITSLOG_ACTIONS:-generateloadrun}"
    depends_on:
      itslog:
        condition: service_healthy