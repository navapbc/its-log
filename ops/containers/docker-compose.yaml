services:
  itslog:
    build:
      context: ../..
      dockerfile: ops/containers/itslog/Dockerfile
    command: /app/entrypoint.bash
    ports:
      - "8888:8888"
    volumes:
      - ../../api/its-log:/app/its-log
      - ./itslog/data:/data
      - ./itslog/scripts/internal/entrypoint.bash:/app/entrypoint.bash
    healthcheck:
      test: ["CMD", "curl", "-f", "http://itslog:8888/v1/health"]
      interval: 300s
      retries: 1
      start_period: 5s
      timeout: 3s
    depends_on:
      ministack:
        condition: service_healthy

  ministack:
    image: nahuelnucera/ministack:latest
    ports:
      - "4566:4566"
    environment:
      PERSIST_STATE: 1
      LOG_LEVEL: DEBUG
      S3_PERSIST: 1
      SERVICES: s3
      GATEWAY_PORT: 4566
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RDS_BASE_PORT: 15432
      ELASTICACHE_BASE_PORT: 16379
      S3_DATA_DIR: /tmp/ministack-data/s3
      STATE_DIR: /tmp/ministack-state
    volumes:
      - "/tmp/ministack-s3:/tmp/ministack-data/s3"
      - "/tmp/ministack-state:/tmp/ministack-state"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: ministack-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Optional: Postgres for RDS (always-on, no Docker-in-Docker needed)
  # Uncomment to have a persistent Postgres available at localhost:5432
  # This is not strictly needed for its-log, but flagging it here as a ministack
  # possibility if RDS emulation is desired later.
