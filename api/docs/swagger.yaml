        in: header
        name: x-api-key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/itslog.Success'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/itslog.Error'
      summary: log a source and event as part of a cluster
      tags:
      - events
