paths:
  /cse/{cluster}/{source}/{event}:
    put:
      consumes:
      - application/json
      description: log a source and event as part of a cluster
      parameters:
      - description: a UUID representing this cluster
        in: path
        name: cluster
        required: true
        type: string
      - description: an event category
        in: path
        name: event
        required: true
