definitions:
  types.Error:
    properties:
      data:
        additionalProperties: {}
        type: object
      error:
        type: string
      error_type:
        type: string
      status:
        type: string
    type: object
  types.Success:
    properties:
      status:
        type: string
    type: object
info:
  contact: {}
paths:
  /csev/{cluster}/{source}/{event}/{value}:
    put:
      consumes:
      - application/json
      description: log a source and event with a unique value as part of a cluster
      parameters:
      - description: a UUID representing this cluster
        in: path
        name: cluster
        required: true
        type: string
      - description: an event category
        in: path
        name: event
        required: true
        type: string
      - description: a source category
        in: path
        name: source
        required: true
        type: string
      - description: a unique value associated with this event
        in: path
        name: value
        required: true
        type: string
      - description: API key, 32 bytes or more, issued
        in: header
        name: x-api-key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.Success'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.Error'
      summary: log a source and event with a unique value as part of a cluster
      tags:
      - events
swagger: "2.0"
